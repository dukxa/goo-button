name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
        # deliberately no registry-url: it makes setup-node write an _authToken line to .npmrc from
        # a NODE_AUTH_TOKEN secret we don't set, npm sends that empty token first, and the registry
        # answers with a 404 before ever trying OIDC trusted publishing. With no registry-url, no
        # .npmrc is written and npm publish falls through to OIDC on its own; it still defaults to
        # registry.npmjs.org, which is where we publish anyway.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Run tests
        run: pnpm test:full

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag v$tag does not match package/package.json version $pkg"
            exit 1
          fi

      - name: Publish
        working-directory: package
        run: npm publish --provenance --access public
